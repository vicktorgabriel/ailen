# ==============================================================================
# AILEN - Configuration Template
# ==============================================================================
# Copy this file to config/ailen.toml or /etc/ailen/ailen.toml
# Do NOT store real API keys or passwords directly in this file.

schema_version = 3

[node]
node_id = "ailen-bangho-01"
name = "AILEN Unit"
profile = "HYBRID"              # SATELLITE, CLOUD, HYBRID, LOCAL, LAN_BRAIN
data_dir = "data"

[identity]
# Nombre visible del personaje en ESTA instalación. Es configurable: no asumir
# que el personaje se llama "Ailén". AILEN es la plataforma, no el personaje.
display_name = "Asistente"

[display]
enabled = true
backend = "auto"               # auto, sdl2, drm, x11, headless
face_style = "facepack"         # facepack, portrait, vector, pixel
face_engine_library = ""        # empty = runtime/native/<platform library>
facepack_path = "runtime/facepacks/ailen_default.facepack"
facepack_root = "runtime/facepacks" # trusted root; traversal/symlinks outside are rejected
width = 1280
height = 720
fullscreen = true
fps_limit = 30

[audio]
input_device = "default"        # use "auto" for hot-plug capture discovery
output_device = "default"       # use "auto" for hot-plug playback discovery
input_processing_mode = "auto"  # auto, raw or easyeffects (already processed)
capture_gain_db = 0.0           # bounded digital pre-gain; calibrate before changing
auto_gain_enabled = false
auto_gain_target_rms = 0.12
max_auto_gain_db = 18.0
auto_gain_attack_ms = 120.0
auto_gain_release_ms = 600.0
auto_gain_noise_gate_rms = 0.008 # AGC never increases gain below this input RMS
auto_gain_gate_hold_ms = 300.0  # bridge short speech pauses before gain decays
capture_limiter_peak = 0.98
output_volume = 80
music_volume = 60
sample_rate = 16000
channels = 1
frame_ms = 20.0

[vision]
enabled = true
camera_source = "auto"          # auto, usb, rtsp
camera_device = "/dev/video0"
fps = 5
detector = "haar"              # haar (experimental) or yunet
detector_model_path = ""        # required for yunet; provisioned asset path
detector_score_threshold = 0.8
presence_confirm_seconds = 0.8
absence_confirm_seconds = 2.0
dropout_grace_seconds = 0.6
min_confidence = 0.5

[speech]
stt_engine = "mock"            # mock, whisper_cpp, vosk, cloud
stt_language = "es"
stt_fallback_engine = "none"
stt_fallback_model_path = ""
stt_fallback_confidence_threshold = 0.72
voice_action_min_confidence = 0.72 # side-effecting voice commands below this ask for repetition
stt_noise_confidence_max = 0.20 # below this is acoustic noise, never valid conversation
stt_conversation_min_confidence = 0.45 # below this asks for a brief repetition
stt_model_path = ""            # path to vosk/whisper model directory or file
tts_engine = "mock"            # mock, piper, chatterbox, cloud
tts_voice = "es_ES-standard"   # e.g. es_ES-davefx-medium
tts_model_path = ""            # path to piper .onnx model
tts_rate = 1.0
tts_threads = 0
tts_fallback_engine = "none"  # none, piper
chatterbox_endpoint = "http://127.0.0.1:8765"
chatterbox_timeout_seconds = 6.0
chatterbox_pitch_semitones = 0.0
chatterbox_rate_scale = 1.0
tts_config_path = ""           # path to piper .onnx.json
noise_suppression_engine = "none"
noise_suppression_level = 2
vad_engine = "energy"          # energy, webrtc, mock
vad_threshold = 0.02
vad_webrtc_mode = 2           # normalized RMS [0.0..1.0]
silence_timeout_ms = 700       # silence duration to conclude utterance
min_speech_ms = 250            # minimum voice duration to trigger utterance
max_utterance_seconds = 15.0   # maximum utterance duration limit
interruption_enabled = true       # allow user barge-in during TTS
interruption_threshold_rms = 0.08
interruption_min_ms = 120
interruption_calibration_ms = 160
interruption_leak_multiplier = 1.25

[ai]
provider = "auto"              # auto, local, lan_brain, remote:<provider_id>
max_tokens = 512
temperature = 0.6
context_recent_messages = 4
context_char_budget = 2400
timeout_seconds = 10.0
daily_budget_usd = 1.0
allow_remote = true
allow_sanitized_external_prompts = false  # only the current turn may leave Core

[ai.local]
enabled = false
endpoint = "http://127.0.0.1:11434/v1"
model = ""                     # selected by provisioning; explicit lab override is allowed
timeout_seconds = 20.0
context_tokens = 2048
priority = 40
runtime = "auto"               # auto, ollama, llama_cpp
intent_model = ""
intent_timeout_seconds = 5.0

[ai.lan]
enabled = false
provider = "openai_compatible"
endpoint = "http://192.168.1.100:8080/v1"
model = ""
trusted = false
timeout_seconds = 15.0
priority = 30

[ai.remote]
enabled = true

# Presets define protocol/endpoints only. Model IDs are selected manually or
# loaded from a live catalog; no preset claims that a model is currently valid.
[ai.remote.providers.openai]
enabled = false
preset = "openai"
protocol = "openai_responses"
endpoint = "https://api.openai.com/v1"
model = ""
api_key_env = "AILEN_OPENAI_API_KEY"
api_key_file = "remote_openai_key"
auth_mode = "api_key"
priority = 40
timeout_seconds = 10.0
streaming_enabled = true
voice_realtime_eligible = false
qualification_status = "configured"
catalog_mode = "live"

[ai.remote.providers.anthropic]
enabled = false
preset = "anthropic"
protocol = "anthropic_messages"
endpoint = "https://api.anthropic.com/v1"
model = ""
api_key_env = "AILEN_ANTHROPIC_API_KEY"
api_key_file = "remote_anthropic_key"
auth_mode = "api_key"
priority = 50
timeout_seconds = 10.0
streaming_enabled = true
voice_realtime_eligible = false
qualification_status = "configured"
catalog_mode = "manual"
anthropic_version = "2023-06-01"

[ai.remote.providers.deepseek]
enabled = false
preset = "deepseek"
protocol = "openai_chat"
endpoint = "https://api.deepseek.com"
model = ""
api_key_env = "AILEN_DEEPSEEK_API_KEY"
api_key_file = "remote_deepseek_key"
auth_mode = "api_key"
priority = 60
timeout_seconds = 10.0
streaming_enabled = true
voice_realtime_eligible = false
qualification_status = "configured"
catalog_mode = "manual"

[ai.remote.providers.kimi]
enabled = false
preset = "kimi"
protocol = "openai_chat"
endpoint = "https://api.moonshot.ai/v1"
model = ""
api_key_env = "AILEN_KIMI_API_KEY"
api_key_file = "remote_kimi_key"
auth_mode = "api_key"
priority = 70
timeout_seconds = 10.0
streaming_enabled = true
voice_realtime_eligible = false
qualification_status = "configured"
catalog_mode = "manual"

[ai.remote.providers.minimax]
enabled = false
preset = "minimax"
protocol = "openai_chat"
endpoint = "https://api.minimax.io/v1"
model = ""
api_key_env = "AILEN_MINIMAX_API_KEY"
api_key_file = "remote_minimax_key"
auth_mode = "api_key"
priority = 80
timeout_seconds = 10.0
streaming_enabled = true
voice_realtime_eligible = false
qualification_status = "configured"
catalog_mode = "manual"

# Add any number of separately named compatible providers. Use a distinct
# secret env/file for each provider; never put the secret value in TOML.
[ai.remote.providers.my_openai_compatible]
enabled = false
preset = "openai_compatible"
protocol = "openai_chat"
endpoint = ""
model = ""
api_key_env = ""
api_key_file = ""
auth_mode = "api_key"
priority = 90
timeout_seconds = 10.0
streaming_enabled = true
voice_realtime_eligible = false
qualification_status = "configured"
catalog_mode = "manual"
[memory]
sqlite_path = "data/ailen.db"
fts_enabled = true
retention_days = 90
auto_vacuum = true

[personality]
description = ""
seed = "ailen-seed-01"
evolution_enabled = true
evolution_rate = 1.0
base_curiosity = 0.7
base_sociability = 0.6
base_formality = 0.5
base_humor = 0.5
base_verbosity = 0.4
base_patience = 0.7
base_expressiveness = 0.6

[social]
default_mode = "WORKSHOP"      # HOME, WORKSHOP, SHOP, PUBLIC, PRIVATE, SLEEP
greeting_cooldown_seconds = 300.0
auto_greeting_enabled = true
public_memory_filter = true

[web]
enabled = true
host = "127.0.0.1"
port = 8080
session_expiry_hours = 24
rate_limit_rpm = 60

[network]
# Outbound network permission for controlled WebSearch/WebFetch tools.
# Independent from conversational remote-provider permissions.
outbound_web_enabled = false
web_search_provider = "none"
web_search_region = "ar-es"

[updates]
channel = "beta"               # nightly, beta, stable
auto_check = false
check_interval_hours = 24
manifest_url = ""
manifest_signature_url = ""
trust_public_key_path = ""
auto_install = false
maintenance_window = "03:00"

[logging]
level = "INFO"                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
json_format = false
redact_secrets = true
