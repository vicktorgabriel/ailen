# ==============================================================================
# AILEN - Configuration Template
# ==============================================================================
# Copy this file to config/ailen.toml or /etc/ailen/ailen.toml
# Do NOT store real API keys or passwords directly in this file.

schema_version = 1

[node]
node_id = "ailen-bangho-01"
name = "AILEN Unit"
profile = "HYBRID"              # SATELLITE, CLOUD, HYBRID, LOCAL, LAN_BRAIN
data_dir = "data"

[identity]
# Nombre visible del personaje en ESTA instalación. Es configurable: no asumir
# que el personaje se llama "Ailén". AILEN es la plataforma, no el personaje.
display_name = "Asistente"

[display]
enabled = true
backend = "auto"               # auto, sdl2, drm, x11, headless
face_style = "vector"           # vector, pixel
width = 1280
height = 720
fullscreen = true
fps_limit = 30

[audio]
input_device = "default"        # use "auto" for hot-plug capture discovery
output_device = "default"       # use "auto" for hot-plug playback discovery
input_volume = 80
output_volume = 80
music_volume = 60
sample_rate = 16000
channels = 1
frame_ms = 20.0

[vision]
enabled = true
camera_source = "auto"          # auto, usb, rtsp
camera_device = "/dev/video0"
fps = 5
detector = "haar"              # haar (experimental) or yunet
detector_model_path = ""        # required for yunet; provisioned asset path
detector_score_threshold = 0.8
presence_confirm_seconds = 0.8
absence_confirm_seconds = 2.0
dropout_grace_seconds = 0.6
min_confidence = 0.5

[speech]
stt_engine = "mock"            # mock, whisper_cpp, vosk, cloud
stt_language = "es"
stt_fallback_engine = "none"
stt_fallback_model_path = ""
stt_fallback_confidence_threshold = 0.72
stt_model_path = ""            # path to vosk/whisper model directory or file
tts_engine = "mock"            # mock, piper, chatterbox, cloud
tts_voice = "es_ES-standard"   # e.g. es_ES-davefx-medium
tts_model_path = ""            # path to piper .onnx model
tts_rate = 1.0
tts_threads = 0
tts_fallback_engine = "none"  # none, piper
chatterbox_endpoint = "http://127.0.0.1:8765"
chatterbox_timeout_seconds = 6.0
chatterbox_pitch_semitones = 0.0
chatterbox_rate_scale = 1.0
tts_config_path = ""           # path to piper .onnx.json
noise_suppression_engine = "none"
noise_suppression_level = 2
vad_engine = "energy"          # energy, webrtc, mock
vad_threshold = 0.02
vad_webrtc_mode = 2           # normalized RMS [0.0..1.0]
silence_timeout_ms = 700       # silence duration to conclude utterance
min_speech_ms = 250            # minimum voice duration to trigger utterance
max_utterance_seconds = 15.0   # maximum utterance duration limit
interruption_enabled = true       # allow user barge-in during TTS
interruption_threshold_rms = 0.08
interruption_min_ms = 120
interruption_calibration_ms = 160
interruption_leak_multiplier = 1.25

[ai]
provider = "mock"              # mock, local, lan_brain, cloud
model = "default"
max_tokens = 512
temperature = 0.6
context_recent_messages = 4
context_char_budget = 2400
timeout_seconds = 10.0
daily_budget_usd = 1.0
allow_cloud = true

[ai.local]
enabled = false
endpoint = "http://127.0.0.1:8080/v1"
model = "local-model"
timeout_seconds = 20.0
context_tokens = 2048
# keep_alive = "24h"  # optional: avoid cold starts on an always-on node

[ai.lan]
enabled = false
endpoint = "http://192.168.1.100:8080/v1"
model = "lan-model"
trusted = false             # opt-in: only mark true for a LAN Brain you control/trust
timeout_seconds = 15.0

[ai.cloud]
enabled = false
provider = "openai_compatible" # configure a current provider explicitly
endpoint = ""
model = ""
api_key_env = "AILEN_AI_CLOUD_API_KEY"
api_key_file = "ai_cloud_key"
daily_budget_usd = 1.0
monthly_budget_usd = 20.0
timeout_seconds = 10.0
# input_cost_per_million = 0.0   # REQUIRED when enabling cloud: set current provider pricing
# output_cost_per_million = 0.0  # REQUIRED when enabling cloud: set current provider pricing

[memory]
sqlite_path = "data/ailen.db"
fts_enabled = true
retention_days = 90
auto_vacuum = true

[personality]
description = ""
seed = "ailen-seed-01"
evolution_enabled = true
evolution_rate = 1.0
base_curiosity = 0.7
base_sociability = 0.6
base_formality = 0.5
base_humor = 0.5
base_verbosity = 0.4
base_patience = 0.7
base_expressiveness = 0.6

[social]
default_mode = "WORKSHOP"      # HOME, WORKSHOP, SHOP, PUBLIC, PRIVATE, SLEEP
greeting_cooldown_seconds = 300.0
auto_greeting_enabled = true
public_memory_filter = true

[web]
enabled = true
host = "127.0.0.1"
port = 8080
session_expiry_hours = 24
rate_limit_rpm = 60

[network]
# Outbound network permission for controlled WebSearch/WebFetch tools.
# Independent from ai.cloud.enabled/allow_cloud.
outbound_web_enabled = false
web_search_provider = "none"
web_search_region = "ar-es"

[updates]
channel = "beta"               # nightly, beta, stable
auto_check = false
check_interval_hours = 24

[logging]
level = "INFO"                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
json_format = false
redact_secrets = true
