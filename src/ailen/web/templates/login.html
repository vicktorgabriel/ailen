<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Acceso Administrativo · AILÉN</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-header">
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem;">
        <span style="font-size: 2rem;">🔥</span>
        <h1 style="font-size: 1.8rem; font-weight: 700; margin: 0; color: var(--fg-primary);">AILÉN</h1>
      </div>
      <p style="color: var(--fg-secondary); font-size: 0.88rem;">Panel de Administración Local del Asistente</p>
    </div>

    {{ raw:notice }}

    <form method="post" action="/login" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="username">Usuario Administrador</label>
        <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required placeholder="admin">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        <span>Ingresar al Panel ➔</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 0.5rem;">
      <small style="color: var(--fg-muted); font-size: 0.75rem;">
        Protegido por PBKDF2-HMAC-SHA256 y bloqueo por IP.
      </small>
    </div>
  </main>
</body>
</html>
