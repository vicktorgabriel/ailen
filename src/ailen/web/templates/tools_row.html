<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border-color);">
  <div>
    <div style="font-weight: 600; font-size: 0.88rem;">{{ class_name }} (<code>{{ tool_name }}</code>)</div>
    <div class="form-help">{{ description }}</div>
    <div class="form-help">Modos: {{ allowed_modes }} · Privacidad: {{ privacy_level }} · Timeout: {{ timeout }} · {{ mode_policy }}</div>
    <div class="form-help">Disponibilidad por config: {{ config_availability }}</div>
  </div>
  <span class="badge-neutral">{{ contract_status }}</span>
</div>
