[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ailen"
version = "0.4.0.dev0"
description = "Asistente físico modular y expresivo para hardware reciclado"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AILEN Project" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
hardware = [
    "psutil>=5.9.0",
]
vision = [
    "opencv-python-headless>=4.8.0,<5",
]
stt-vosk = [
    "vosk>=0.3.45",
]
vad-webrtc = [
    "webrtcvad-wheels>=2.0.14,<3",
]
noise-webrtc = [
    "webrtc-noise-gain>=1.2,<2",
]
web = [
    "ddgs>=9.14,<10",
]

[project.scripts]
ailen = "ailen.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ailen*"]

[tool.setuptools.package-data]
ailen = [
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "infrastructure/sqlite/migrations/*.sql",
    "face/assets/portrait/*.png",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The Debian Lab project lives on fuseblk, which presents repository .py files
# as executable. Limit the mount-permission exception to Python code paths.
"src/**/*.py" = ["EXE002"]
"tests/**/*.py" = ["EXE002"]
"tools/**/*.py" = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
